name: test

# The member gateway's and the shared generator's tests, on every PR and every push
# to main. No secrets: everything runs on the runner, against stand-ins and a local
# Keycloak.
#
#   unit         make test: the helpers and what the generator makes of their output
#   e2e          make e2e: the built image against a stand-in identity provider
#   e2e-session  make e2e-session: the sign-in door against a real Keycloak (~5 min)
#   e2e-terms    the terms step after sign-in: builds control-plane/keycloak (its Java unit
#                tests run in that build) and signs in through a real broker (~3 min)
#   e2e-metrics  the usage metrics: keycloak/metrics.sh and the exporter image against a
#                real Keycloak (~2 min)
#
# The two end-to-end jobs run only when something they test has changed. A skipped job
# counts as passed, so all three can be required checks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.diff.outputs.gateway }}
      keycloak: ${{ steps.diff.outputs.keycloak }}
      metrics: ${{ steps.diff.outputs.metrics }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # On main and on a manual run, test everything.
          if [[ "$EVENT" != pull_request ]]; then
            { echo "gateway=true"; echo "keycloak=true"; echo "metrics=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if grep -qE '^(member-gateway/|data-plane/(scripts|apisix)/|control-plane/keycloak/|\.github/workflows/test\.yml$)' <<<"$changed"; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(control-plane/keycloak/|\.github/workflows/test\.yml$)' <<<"$changed"; then
            echo "keycloak=true" >> "$GITHUB_OUTPUT"
          else
            echo "keycloak=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(control-plane/metrics/|control-plane/keycloak/(metrics\.sh|realm-federation\.json)$|\.github/workflows/test\.yml$)' <<<"$changed"; then
            echo "metrics=true" >> "$GITHUB_OUTPUT"
          else
            echo "metrics=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx --with pyyaml --with prometheus-client==0.21.1 pytest -q member-gateway/tests control-plane/metrics/tests

  e2e:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: docker build -f member-gateway/Dockerfile -t member-gateway:test .
      - run: uv run --no-project --with pyyaml python member-gateway/tests/e2e.py --image member-gateway:test

  e2e-session:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: docker build -f member-gateway/Dockerfile -t member-gateway:test .
      - run: uv run --no-project --with pyyaml python member-gateway/tests/e2e_session.py --image member-gateway:test

  e2e-terms:
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t federation-keycloak:test control-plane/keycloak
      - run: python3 control-plane/keycloak/tests/e2e_terms.py --image federation-keycloak:test

  e2e-metrics:
    needs: changes
    if: needs.changes.outputs.metrics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fed-metrics-exporter:test control-plane/metrics/exporter
      - run: python3 control-plane/metrics/tests/e2e_metrics.py --image fed-metrics-exporter:test

name: federation-control-plane

# The control plane. Identity and policy configuration only — never in the data path.
#
#   browser ──▶ Traefik :443 ──┬──▶ Keycloak :8080   /realms /admin /resources /js
#                              ├──▶ fed-metrics gateway :9080 ──▶ exporter :9100
#                              │                     /fed-metrics   (profile "metrics")
#                              └──▶ Portal   :8000   everything else
#
# Traefik binds to the control-plane host's Tailscale address only, so this is reachable from the tailnet
# and from nowhere else. The certificate is a real Let's Encrypt one issued by
# `tailscale cert`, so browsers and curl trust it with no CA to install.

services:
  traefik:
    image: traefik:v3.3
    container_name: fed-traefik
    restart: unless-stopped
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - "${BIND_ADDR}:80:80"
      - "${BIND_ADDR}:443:443"
      # Dashboard on loopback only — tailnet peers cannot reach it.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    depends_on:
      keycloak:
        condition: service_healthy
      portal:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: fed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume: registrations, offline sessions and minted client secrets must
      # survive `docker compose down`. Use `make nuke` to discard them deliberately.
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Stock Keycloak plus the federation's terms step and login theme (keycloak/Dockerfile).
    build: ./keycloak
    image: federation-keycloak:latest
    container_name: fed-keycloak
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # The temporary admin, created only on first start against an empty database.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Keycloak must generate absolute URLs (issuer, redirect, JWKS) using the public
      # name, not the container's. Traefik terminates TLS and forwards over plain HTTP.
      KC_HOSTNAME: https://${CONTROL_HOST}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Keycloak's own counters of sign-ins and token refreshes, by client. (No user
      # in any label; the per-service view is the exporter's, below.)
      KC_FEATURES: user-event-metrics
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_TAGS: realm,clientId
      KC_LOG_LEVEL: info

      # Signs the optional "remember my agreement" cookie (keycloak/terms-flow.sh).
      # Unset or shorter than 32 characters: the page offers no cookie.
      FED_TERMS_COOKIE_SECRET: ${TERMS_COOKIE_SECRET:-}
    volumes:
      - ./keycloak/realm-federation.json:/opt/keycloak/data/import/realm-federation.json:ro
    expose:
      - "8080"
    healthcheck:
      # Health lives on the management port (9000) in Keycloak 26, and the image ships
      # no curl or wget — but it does have bash, so /dev/tcp is the way in. CMD-SHELL
      # would use `sh`, where `echo -e` prints the escapes literally; invoke bash
      # directly and let printf build the request.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build: ./portal
    image: federation-portal:latest
    container_name: fed-portal
    restart: unless-stopped
    environment:
      CONTROL_HOST: ${CONTROL_HOST}
      KC_REALM: ${KC_REALM}
      # Server-to-server calls stay on the compose network and skip Traefik entirely.
      KC_INTERNAL_URL: http://keycloak:8080
      KC_PUBLIC_URL: https://${CONTROL_HOST}
      PORTAL_CLIENT_ID: federation-portal
      PORTAL_ADMIN_CLIENT_ID: portal-admin
      PORTAL_ADMIN_SECRET: ${PORTAL_ADMIN_SECRET}
      CLI_CLIENT_ID: federation-cli
      CREDENTIAL_TTL_DAYS: ${CREDENTIAL_TTL_DAYS}
      DATA_SERVICE_URL: https://${DATA_HOST}
      # The member list, for the commands the portal shows: one scope per service.
      FEDERATION_SERVICES: ${FEDERATION_SERVICES}
      BIRDS_AUDIENCE: ${BIRDS_AUDIENCE:-birds}
    expose:
      - "8000"
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Usage metrics (profile "metrics": COMPOSE_PROFILES=metrics in .env) ──────────
  # The exporter reads Keycloak's stored events and publishes per-service counts in the
  # OpenMetrics format. No user id, name or hash appears in any label.
  fed-metrics-exporter:
    profiles: [metrics]
    build: ./metrics/exporter
    image: federation-metrics-exporter:latest
    container_name: fed-metrics-exporter
    restart: unless-stopped
    environment:
      KC_INTERNAL_URL: http://keycloak:8080
      KC_MANAGEMENT_URL: http://keycloak:9000
      KC_REALM: ${KC_REALM}
      EXPORTER_CLIENT_ID: fed-metrics-exporter
      EXPORTER_CLIENT_SECRET: ${FED_METRICS_EXPORTER_SECRET:-}
      FEDERATION_SERVICES: ${FEDERATION_SERVICES}
      BIRDS_AUDIENCE: ${BIRDS_AUDIENCE:-birds}
      FED_ACTIVE_WINDOWS: ${FED_ACTIVE_WINDOWS:-15m,1h,1d,7d,30d}
    expose:
      - "9100"
    depends_on:
      keycloak:
        condition: service_healthy

  # ...behind a member gateway, like any other member service: audience fed-metrics,
  # and the admin entitlement (metrics/gateway/targets.yaml).
  fed-metrics-gateway:
    profiles: [metrics]
    build:
      context: ..
      dockerfile: member-gateway/Dockerfile
    image: member-gateway:latest
    container_name: fed-metrics-gateway
    restart: unless-stopped
    environment:
      CONTROL_HOST: ${CONTROL_HOST}
      CONTROL_BASE_URL: https://${CONTROL_HOST}
      KC_REALM: ${KC_REALM}
      CONTROL_PORTAL_URL: https://${CONTROL_HOST}${PORTAL_PATH:-/}
      FEDERATION_CLI_CLIENT: federation-cli
      FEDERATION_ACCOUNT_NAME: ${FEDERATION_ACCOUNT_NAME:-meteogate}
      FEDERATION_HELP_URL: https://github.com/6a6d74/meteogate-federated-access-patterns/blob/main/docs/cli-clients.md
      LOCAL_API_KEY_METRICS: ${FED_METRICS_API_KEY:-}
    volumes:
      - ./metrics/gateway:/config:ro
    # It checks tokens against the public issuer, https://CONTROL_HOST, which Traefik
    # answers on BIND_ADDR.
    extra_hosts:
      - "${CONTROL_HOST}:${BIND_ADDR}"
    expose:
      - "9080"
    depends_on:
      - fed-metrics-exporter

volumes:
  keycloak-db:

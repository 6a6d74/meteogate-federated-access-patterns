# ═══════════════════════════════════════════════════════════════════════════════
# Member gateway — operator configuration. GENERATED by scripts/routes-helper.py
# from config/targets.yaml: change that (or rerun the helper), not this.
#
# The container turns this into APISIX's own configuration each time it starts.
# ${VARS} come from federation.env and gateway.env; no secret is written here.
# Tokens are accepted only if they name this service: audience fed-metrics.
#
# Open routes: enabled.
# ═══════════════════════════════════════════════════════════════════════════════

service:
  name: Federation usage metrics
  upstream: http://fed-metrics-exporter:9100
  pass_host: pass
listen:
  host: ${CONTROL_HOST}
auth:
  provider: keycloak
  discovery: ${CONTROL_BASE_URL}/realms/${KC_REALM}/.well-known/openid-configuration
  issuer: ${CONTROL_BASE_URL}/realms/${KC_REALM}
  jwks_url: ${CONTROL_BASE_URL}/realms/${KC_REALM}/protocol/openid-connect/certs
  audience: fed-metrics
  portal: ${CONTROL_PORTAL_URL}
  help: ${FEDERATION_HELP_URL}
  cli:
    client_id: ${FEDERATION_CLI_CLIENT}
    account_name: ${FEDERATION_ACCOUNT_NAME}
  token_url: ${CONTROL_BASE_URL}/realms/${KC_REALM}/protocol/openid-connect/token
rate_limiting:
  requests_per_minute: 0
cors:
  origins:
  - '*'
local_keys:
  header: apikey
  consumers:
  - name: metrics
    key: ${LOCAL_API_KEY_METRICS}
routes:
- name: usage
  path: /usage
  methods: &id001
  - GET
  auth: federated
  require_entitlement: urn:meteogate:testbed:entitlement:admin
  rate_limiting:
    requests_per_minute: 0
- name: usage-slash
  path: /usage/
  methods: *id001
  auth: federated
  require_entitlement: urn:meteogate:testbed:entitlement:admin
  rate_limiting:
    requests_per_minute: 0
- name: usage-key
  path: /local/usage
  methods: &id002
  - GET
  auth: apikey
  upstream_path: /usage
  forwarded_prefix: /local
  rate_limiting:
    requests_per_minute: 0
- name: usage-key-slash
  path: /local/usage/
  methods: *id002
  auth: apikey
  upstream_path: /usage/
  forwarded_prefix: /local
  rate_limiting:
    requests_per_minute: 0
- name: usage-open
  path: /open/usage
  methods: &id003
  - GET
  auth: none
  upstream_path: /usage
  forwarded_prefix: /open
  rate_limiting:
    requests_per_minute: 0
- name: usage-open-slash
  path: /open/usage/
  methods: *id003
  auth: none
  upstream_path: /usage/
  forwarded_prefix: /open
  rate_limiting:
    requests_per_minute: 0
- name: keycloak
  path: /keycloak
  methods: &id004
  - GET
  auth: federated
  require_entitlement: urn:meteogate:testbed:entitlement:admin
  rate_limiting:
    requests_per_minute: 0
- name: keycloak-slash
  path: /keycloak/
  methods: *id004
  auth: federated
  require_entitlement: urn:meteogate:testbed:entitlement:admin
  rate_limiting:
    requests_per_minute: 0
- name: keycloak-key
  path: /local/keycloak
  methods: &id005
  - GET
  auth: apikey
  upstream_path: /keycloak
  forwarded_prefix: /local
  rate_limiting:
    requests_per_minute: 0
- name: keycloak-key-slash
  path: /local/keycloak/
  methods: *id005
  auth: apikey
  upstream_path: /keycloak/
  forwarded_prefix: /local
  rate_limiting:
    requests_per_minute: 0
- name: keycloak-open
  path: /open/keycloak
  methods: &id006
  - GET
  auth: none
  upstream_path: /keycloak
  forwarded_prefix: /open
  rate_limiting:
    requests_per_minute: 0
- name: keycloak-open-slash
  path: /open/keycloak/
  methods: *id006
  auth: none
  upstream_path: /keycloak/
  forwarded_prefix: /open
  rate_limiting:
    requests_per_minute: 0

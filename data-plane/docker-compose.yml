name: federation-data-plane

# The data plane. Runs on the data-plane host, in front of the operator's own service.
#
#   user ──▶ APISIX :443 ──┬──▶ api :8000   the birds service, unchanged
#                          └──▶ web :80     the OAuth-aware client and help pages
#              │
#              └─ validates JWTs against Keycloak's JWKS, fetched once and cached.
#                 No per-request call to the centre. Data never leaves this machine
#                 on its way to the user.
#
# APISIX binds to the data-plane host's Tailscale address only.

services:
  apisix:
    image: apache/apisix:3.13.0-debian
    container_name: fed-apisix
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:80:9080"
      - "${BIND_ADDR}:443:9443"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # Generated from gateway-config/*.yaml. APISIX rereads it about once a second,
      # so `make config` takes effect without a restart.
      - ./apisix/conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # Custom plugins, found via apisix.extra_lua_path: "/opt/?.lua"
      - ./apisix/plugins:/opt/apisix/plugins:ro
    depends_on:
      - api
      - web

  api:
    # The service being protected, built from its own repository and otherwise
    # untouched. It has no idea it is behind a gateway, which is the point: an
    # operator who cannot modify their service still gets federated access control.
    build: ${BIRDS_SERVICE_DIR}
    image: avian-visitors-api:latest
    container_name: fed-api
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ${BIRDS_SERVICE_DIR}/birds.csv:/data/birds.csv:ro
      - ${BIRDS_ASSETS_DIR}:/data/illustrations:ro

  web:
    image: nginx:1.27-alpine
    container_name: fed-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

# The web client and help pages. APISIX proxies /birds* and /help* here without
# rewriting the path, so the directory layout under html/ mirrors the URLs.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # config.js is rendered from .env by `make config` and changes per deployment;
    # the rest is static and safe to cache briefly.
    location = /birds/config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
